<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Galen Chat — Настройки и OBS</title>
    <style>
        /* Базовые стили для интерфейса Galen Chat */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0e0e10; 
            color: #efeff1;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .main-wrapper {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
        }
        .panel {
            background-color: #1f1f23;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            border: 1px solid #2f2f35;
        }
        .settings-panel { width: 300px; }
        .chat-container { width: 450px; flex-grow: 1; }
        
        h2, h3 { color: #a970ff; text-align: center; margin-top: 0; }
        h3 { border-bottom: 1px solid #2f2f35; padding-bottom: 5px; font-size: 16px; text-align: left; }
        
        .setting-item { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #adadb8; margin-bottom: 5px; }
        select, input[type="text"] {
            width: 100%; padding: 8px; background-color: #3a3a3d; 
            border: 2px solid #464649; border-radius: 6px; color: white; outline: none;
            box-sizing: border-box;
        }
        
        .color-picker-wrapper { display: flex; align-items: center; gap: 10px; }
        input[type="color"] {
            border: none; width: 40px; height: 40px; border-radius: 5px; cursor: pointer; background: none; padding: 0;
        }

        button {
            width: 100%; padding: 12px; background-color: #9146ff; color: white;
            border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        button:hover { background-color: #772ce8; }
        
        #chat-window {
            height: 400px; background-color: #0e0e10;
            border: 1px solid #2f2f35; border-radius: 8px;
            overflow-y: auto; padding: 10px; display: none;
        }
        
        /* Стили сообщений по умолчанию */
        .message {
            font-size: 16px;
            line-height: 1.4;
            color: #ffffff;
            text-align: left;
            margin-bottom: 6px;
            word-wrap: break-word;
        }
        .username { font-weight: bold; color: #00b4d8; margin-right: 5px; }
        .system-text { color: #53d16c; font-weight: bold; font-style: italic; text-align: center; }
        
        /* Стили для картинок-смайликов */
        .twitch-emote {
            max-height: 28px;
            vertical-align: middle;
            margin: -2px 2px;
        }

        /* Принудительное отключение фона и панелей для OBS (убирает красный фон) */
        .obs-mode .settings-panel, .obs-mode #auth-section, .obs-mode h2, .obs-mode #obs-link-container { display: none !important; }
        .obs-mode .chat-container { width: 100vw; height: 100vh; border: none; background: transparent !important; padding: 0; }
        .obs-mode #chat-window { height: 100vh; background: transparent !important; border: none; padding: 5px; }
        .obs-mode body { background: transparent !important; background-color: transparent !important; }
    </style>
</head>
<body>

    <div class="main-wrapper" id="content-wrapper">
        
        <!-- ПАНЕЛЬ НАСТРОЕК -->
        <div class="panel settings-panel">
            <h3>⚙️ Кастомизация чата</h3>
            
            <div class="setting-item">
                <label>Размер шрифта</label>
                <select id="font-size" onchange="applySettings()">
                    <option value="11px">Очень маленький</option>
                    <option value="14px">Маленький</option>
                    <option value="17px" selected>Средний (дефолт)</option>
                    <option value="22px">Большой</option>
                    <option value="28px">Очень большой</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Семейство шрифта</label>
                <select id="font-family" onchange="applySettings()">
                    <option value="'Segoe UI', sans-serif">Segoe UI (Стандартный)</option>
                    <option value="Arial, sans-serif">Arial (Четкий)</option>
                    <option value="'Courier New', monospace">Courier New (Ретро-код)</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Отступы между сообщениями</label>
                <select id="margin-bottom" onchange="applySettings()">
                    <option value="0px">Без отступа</option>
                    <option value="6px" selected>Маленький (дефолт)</option>
                    <option value="14px">Средний</option>
                    <option value="22px">Большой</option>
                    <option value="32px">Очень большой</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Выравнивание текста</label>
                <select id="text-align" onchange="applySettings()">
                    <option value="left" selected>Слева</option>
                    <option value="center">По центру</option>
                    <option value="right">Справа</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Цвет текста сообщений</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="text-color" value="#ffffff" onchange="applySettings()">
                    <span id="color-hex">#FFFFFF</span>
                </div>
            </div>
        </div>

        <!-- ОКНО ЧАТА -->
        <div class="panel chat-container">
            <h2>Galen Chat</h2>
            
            <div id="auth-section">
                <p>Введите никнейм Twitch канала:</p>
                <input type="text" id="twitch-channel" placeholder="Например: vgor74" value="vgor74">
                <button style="margin-top: 10px;" onclick="connectToBackend()">🚀 Запустить стрим-поток</button>
            </div>

            <div id="chat-window"></div>
        </div>

    </div>
    <script>
        let ws;
        let currentChannel = "vgor74";
        
        // Открытая и стабильная база смайлов Twitch через глобальный CDN
        const emoteDatabase = {
            "vgor74Lemon": "https://jtvnw.net", 
            "vgor741": "https://jtvnw.net",
            "Kappa": "https://jtvnw.net",
            "LUL": "https://jtvnw.net",
            "PogChamp": "https://jtvnw.net"
        };

        // Чтение параметров из URL-строки (для OBS)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('obs')) {
            document.body.classList.add('obs-mode');
            
            // Вытаскиваем переданные настройки из ссылки
            const size = urlParams.get('size') || '17px';
            const family = urlParams.get('font') || "'Segoe UI', sans-serif";
            const margin = urlParams.get('margin') || '6px';
            const align = urlParams.get('align') || 'left';
            const color = urlParams.get('color') || '#ffffff';
            
            // Жестко применяем стили внутри OBS поверх любых других настроек
            let styleElement = document.createElement('style');
            styleElement.innerHTML = `
                .message, .message span.text-body { font-size: ${size} !important; font-family: ${family} !important; color: ${color} !important; }
                .message { margin-bottom: ${margin} !important; text-align: ${align} !important; }
                body, html { background: transparent !important; background-color: transparent !important; }
            `;
            document.head.appendChild(styleElement);

            const autoChannel = urlParams.get('channel');
            if (autoChannel) {
                setTimeout(function() { startSession(autoChannel); }, 500);
            }
        }

        // Обновление URL-ссылки для OBS при изменении любых параметров кастомизации
        function updateObsLink() {
            if (document.body.classList.contains('obs-mode')) return; 

            const size = document.getElementById('font-size').value;
            const family = document.getElementById('font-family').value;
            const margin = document.getElementById('margin-bottom').value;
            const align = document.getElementById('text-align').value;
            const color = encodeURIComponent(document.getElementById('text-color').value);
            
            const cleanUrl = window.location.href.split('?')[0];
            const obsUrl = cleanUrl + '?obs=true&channel=' + currentChannel + '&size=' + size + '&font=' + family + '&margin=' + margin + '&align=' + align + '&color=' + color;
            
            const inputField = document.getElementById("obs-url-input");
            if (inputField) {
                inputField.value = obsUrl;
            }
        }

        function applySettings() {
            const size = document.getElementById('font-size').value;
            const family = document.getElementById('font-family').value;
            const margin = document.getElementById('margin-bottom').value;
            const align = document.getElementById('text-align').value;
            const color = document.getElementById('text-color').value;
            
            document.getElementById('color-hex').innerText = color.toUpperCase();

            let styleElement = document.getElementById('dynamic-chat-styles');
            if (!styleElement) {
                styleElement = document.createElement('style');
                styleElement.id = 'dynamic-chat-styles';
                document.head.appendChild(styleElement);
            }
            styleElement.innerHTML = `
                .message, .message span.text-body { font-size: ${size} !important; font-family: ${family} !important; color: ${color} !important; }
                .message { margin-bottom: ${margin} !important; text-align: ${align} !important; }
            `;
            
            updateObsLink();
        }

        function parseEmotes(text) {
            let words = text.split(' ');
            for (let i = 0; i < words.length; i++) {
                if (emoteDatabase[words[i]]) {
                    words[i] = '<img class="twitch-emote" src="' + emoteDatabase[words[i]] + '" alt="' + words[i] + '">';
                }
            }
            return words.join(' ');
        }

        function connectToBackend() {
            const channelName = document.getElementById('twitch-channel').value.trim();
            if (channelName === "") { alert("Введите никнейм канала!"); return; }
            currentChannel = channelName;
            startSession(channelName);
        }

        function startSession(channelName) {
            ws = new WebSocket("ws://localhost:8765");
            
            ws.onopen = function() {
                if (!document.body.classList.contains('obs-mode')) {
                    document.getElementById('auth-section').style.display = 'none';
                }
                const chatWindow = document.getElementById('chat-window');
                chatWindow.style.display = 'block';
                chatWindow.innerHTML = '<div class="message system-text">🔗 Подключение установлено...</div>';
                
                if (!document.body.classList.contains('obs-mode')) {
                    applySettings();
                    showObsLinkField();
                }
                ws.send(JSON.stringify({"action": "connect", "channel": channelName}));
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const chatWindow = document.getElementById('chat-window');
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message';
                
                const processedText = parseEmotes(data.text);
                msgDiv.innerHTML = '<span class="username" style="color:' + getRandomColor(data.username) + '">' + data.username + ':</span> <span class="text-body">' + processedText + '</span>';
                
                chatWindow.appendChild(msgDiv);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            };
            
            ws.onclose = function() {
                alert("🔴 Соединение разорвано. Проверь, запущен ли server.py!");
            };
        }

        function showObsLinkField() {
            if (document.getElementById('obs-link-container')) return;

            const linkDiv = document.createElement('div');
            linkDiv.id = 'obs-link-container';
            linkDiv.style.marginTop = '15px';
            linkDiv.style.padding = '10px';
            linkDiv.style.backgroundColor = '#111';
            linkDiv.style.borderRadius = '6px';
            linkDiv.style.border = '1px solid #333';
            
            linkDiv.innerHTML = '<label style="font-size:11px; color:#adadb8; display:block; margin-bottom:5px;">Ссылка для вставки в OBS:</label>' +
                '<input type="text" id="obs-url-input" value="" readonly style="padding:6px; font-size:12px; margin-bottom:8px; width:94%; background-color:#2a2a2d; color:#fff; border:1px solid #444; border-radius:4px;">' +
                '<button onclick="copyObsUrl()" style="padding:6px; font-size:12px; background-color:#a970ff; width:100%; font-weight:bold; color:#fff; border:none; border-radius:4px; cursor:pointer;">📋 Скопировать ссылку</button>';
            
            document.querySelector('.chat-container').appendChild(linkDiv);
            updateObsLink();
        }

        function copyObsUrl() {
            const copyText = document.getElementById("obs-url-input");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Ссылка для OBS успешно скопирована! Замени ей старую ссылку в OBS.");
        }

        function getRandomColor(username) {
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            const colors = ['#00b4d8', '#ffb703', '#fb8500', '#ff4d6d', '#38b000', '#e040fb', '#00f5d4', '#ff007f'];
            return colors[Math.abs(hash) % colors.length];
        }
    </script>
</body>
</html>
